<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boondock Finder - Free RV Boondocking Across America</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="sidebar">
  <h1>Boondock Finder</h1>
  <p class="tagline">Free overnight RV parking across America</p>
  <div id="search-box">
    <input type="text" id="search-input" placeholder="Search city, state or zipcode..." />
    <button id="search-btn">Search</button>
  </div>
  <div id="filters">
    <label><input type="checkbox" id="filter-electric" /> Electric hookup available</label>
  </div>
  <div id="results-count"></div>
  <div id="locations-list"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
